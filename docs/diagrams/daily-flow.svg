<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10223b"/><stop offset="1" stop-color="#0c1729"/></linearGradient><linearGradient id="band"><stop stop-color="#1645b8"/><stop offset="1" stop-color="#2f77ef"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#84b9ff" stroke-width="1.5"/></marker></defs><rect width="1440" height="1070" fill="url(#bg)"/><rect x="36" y="28" width="1368" height="126" rx="22" fill="url(#band)"/><g font-family="'Yu Gothic',Meiryo,'Noto Sans JP',sans-serif" fill="#eef4ff"><text x="66" y="60" font-size="14" letter-spacing="3">NEWS POCKET / 2026.10.16</text><text x="66" y="104" font-size="31" font-weight="700">毎日、新しいニュースが届く仕組み</text><text x="66" y="134" font-size="17">一覧は見出しだけ。解説・重要な理由・自分への影響・出典は、記事を開いて読む。</text><rect x="48" y="216" width="416" height="230" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="68" y="248" font-size="23" fill="#eef4ff">01  専用タスクを起動</text><text x="68" y="279" font-size="16" fill="#b9c9e4">ChatGPTのクラウド定期タスク</text><text x="68" y="306" font-size="16" fill="#b9c9e4">日本時間8:00ごろを設定する</text><text x="68" y="333" font-size="16" fill="#b9c9e4">PCを止めたまま動かす方式</text><text x="68" y="360" font-size="16" fill="#b9c9e4">既存の朝ニュースタスクは変更しない</text><rect x="512" y="216" width="416" height="230" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="532" y="248" font-size="23" fill="#eef4ff">02  Webで調査・照合</text><text x="532" y="279" font-size="16" fill="#b9c9e4">ChatGPTのWeb検索</text><text x="532" y="306" font-size="16" fill="#b9c9e4">6テーマの重要・身近な話を探す</text><text x="532" y="333" font-size="16" fill="#b9c9e4">一次発表や信頼できる報道を確認</text><text x="532" y="360" font-size="16" fill="#b9c9e4">有料部分・制限された本文は使わない</text><rect x="976" y="216" width="416" height="230" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="996" y="248" font-size="23" fill="#eef4ff">03  ニュースを選ぶ</text><text x="996" y="279" font-size="16" fill="#b9c9e4">ChatGPTによる選定</text><text x="996" y="306" font-size="16" fill="#b9c9e4">各テーマ0〜3件・全体最大18件</text><text x="996" y="333" font-size="16" fill="#b9c9e4">前回の掲載内容と比べて重複を避ける</text><text x="996" y="360" font-size="16" fill="#b9c9e4">条件に合わない話で件数を埋めない</text><rect x="48" y="504" width="416" height="230" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="68" y="536" font-size="23" fill="#eef4ff">04  短い独自解説を保存</text><text x="68" y="567" font-size="16" fill="#b9c9e4">ChatGPT → GitHubの記事JSON</text><text x="68" y="594" font-size="16" fill="#b9c9e4">要点・重要な理由・自分への影響</text><text x="68" y="621" font-size="16" fill="#b9c9e4">出典URL・実際の確認日時を付ける</text><text x="68" y="648" font-size="16" fill="#b9c9e4">人による全件確認とは表示しない</text><rect x="512" y="504" width="416" height="230" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="532" y="536" font-size="23" fill="#eef4ff">05  検査してサイトへ配信</text><text x="532" y="567" font-size="16" fill="#b9c9e4">GitHub Actions → Workers</text><text x="532" y="594" font-size="16" fill="#b9c9e4">形式・日時・出典欄を検査</text><text x="532" y="621" font-size="16" fill="#b9c9e4">既存の専用キーで受信APIへ送信</text><text x="532" y="648" font-size="16" fill="#b9c9e4">形式検査は内容の正しさの保証ではない</text><rect x="976" y="504" width="416" height="230" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="996" y="536" font-size="23" fill="#eef4ff">06  既存サイトへ反映</text><text x="996" y="567" font-size="16" fill="#b9c9e4">Cloudflare D1 → 画面</text><text x="996" y="594" font-size="16" fill="#b9c9e4">見出し一覧に新しい記事を追加</text><text x="996" y="621" font-size="16" fill="#b9c9e4">クリックで詳細・出典を表示</text><text x="996" y="648" font-size="16" fill="#b9c9e4">あとで読むはGoogleの利用者別</text><path d="M464 330H503" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M928 330H967" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1184 446V476H256V497" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M464 618H503" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M928 618H967" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="804" width="1344" height="112" rx="18" fill="#483b24" stroke="#947445"/><text x="72" y="840" font-size="22" fill="#ffd48a">作成できない・承認待ち・利用上限に達したとき</text><text x="72" y="872" font-size="18" fill="#eef4ff">前の記事を残す。古い記事を新しい日付で再配信しない。ChatGPT側とActionsの実行履歴を調べる。</text><text x="72" y="899" font-size="16" fill="#b9c9e4">サイトの設定画面では、接続設定と最終反映を区別。定期実行の実績は初回自動実行後に別途確認する。</text><text x="60" y="958" font-size="19" fill="#eef4ff">追加の検索API・有料OpenAI APIは使わない。ChatGPTの既存契約の利用枠内で実行する設計。</text><text x="60" y="993" font-size="17" fill="#b9c9e4">Workers AIは今回の毎日更新では呼ばない。既存の本文要約は1人30件・全体50件／日の上限を維持。</text><text x="60" y="1032" font-size="17" fill="#ffd48a">初回の全工程は成功。10月17日以降、予定時刻に自動で動いた実績を別途確認する。</text></g></svg>