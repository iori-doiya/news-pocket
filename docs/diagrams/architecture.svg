<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2362d4"/></marker></defs><rect width="1600" height="1100" fill="#f1f6fc"/><rect width="1600" height="155" fill="#133f91"/><g font-family="'Yu Gothic',Meiryo,'Noto Sans JP',sans-serif"><text x="55" y="66" font-size="44" fill="white" font-weight="700" text-anchor="start">ニュースポケットは、こう動く</text><text x="58" y="114" font-size="28" fill="#e1edff" font-weight="400" text-anchor="start">ChatGPTがニュースを作り、GitHub Actionsがサイトへ届けます。</text><rect x="55" y="180" width="470" height="43" rx="21" fill="#e0edff"/><text x="290" y="209" font-size="24" fill="#2362d4" font-weight="700" text-anchor="middle">毎日 朝8:00ごろに自動更新する設定</text><text x="1545" y="210" font-size="24" fill="#49627b" font-weight="400" text-anchor="end">あなたのPCを止めていても動く構成</text><rect x="55" y="245" width="326" height="298" rx="24" fill="white" stroke="#c9daee" stroke-width="2"/><circle cx="91" cy="280" r="19" fill="#2362d4"/><text x="91" y="287" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="218" y="330" font-size="30" fill="#17314d" font-weight="700" text-anchor="middle">探す・まとめる</text><g transform="translate(186 350)" fill="none" stroke="#2362d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="23" cy="22" r="15"/><path d="m35 34 14 14M16 18h14M16 26h10"/></g><text x="218" y="445" font-size="32" fill="#2362d4" font-weight="700" text-anchor="middle">ChatGPT</text><text x="218" y="485" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">Webから重要ニュースを選び</text><text x="218" y="516" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">短い解説と出典を作る</text><rect x="443" y="245" width="326" height="298" rx="24" fill="white" stroke="#c9daee" stroke-width="2"/><circle cx="479" cy="280" r="19" fill="#2362d4"/><text x="479" y="287" font-size="23" fill="white" font-weight="700" text-anchor="middle">2</text><text x="606" y="330" font-size="30" fill="#17314d" font-weight="700" text-anchor="middle">保存して届ける</text><text x="606" y="379" font-size="27" fill="#2362d4" font-weight="700" text-anchor="middle">GitHub</text><text x="606" y="411" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">できた記事の置き場</text><path d="M481 430h250" stroke="#dfE8f2" stroke-width="2"/><text x="606" y="470" font-size="27" fill="#2362d4" font-weight="700" text-anchor="middle">GitHub Actions</text><text x="606" y="510" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">記事を検査してサイトへ送る</text><rect x="831" y="245" width="326" height="298" rx="24" fill="white" stroke="#c9daee" stroke-width="2"/><circle cx="867" cy="280" r="19" fill="#2362d4"/><text x="867" y="287" font-size="23" fill="white" font-weight="700" text-anchor="middle">3</text><text x="994" y="330" font-size="30" fill="#17314d" font-weight="700" text-anchor="middle">サイトを動かす</text><g transform="translate(964 350)" fill="none" stroke="#2362d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="54" height="39" rx="5"/><path d="M4 18h54M23 46v9m16-9v9M17 55h28M12 12h1m6 0h1"/></g><text x="994" y="445" font-size="27" fill="#2362d4" font-weight="700" text-anchor="middle">Cloudflare Workers</text><text x="994" y="485" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">記事を受け取り、画面を表示</text><text x="994" y="516" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">保存やログインも処理する</text><rect x="1219" y="245" width="326" height="298" rx="24" fill="white" stroke="#c9daee" stroke-width="2"/><circle cx="1255" cy="280" r="19" fill="#2362d4"/><text x="1255" y="287" font-size="23" fill="white" font-weight="700" text-anchor="middle">4</text><text x="1382" y="330" font-size="30" fill="#17314d" font-weight="700" text-anchor="middle">読む・保存する</text><g transform="translate(1352 350)" fill="none" stroke="#2362d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="14" r="10"/><path d="M12 54V41c0-17 36-17 36 0v13M4 54h52"/></g><text x="1382" y="445" font-size="27" fill="#2362d4" font-weight="700" text-anchor="middle">あなたのスマホ・PC</text><text x="1382" y="485" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">見出しを選んで解説を読む</text><text x="1382" y="516" font-size="21" fill="#17314d" font-weight="400" text-anchor="middle">気になる記事を「あとで読む」へ</text><path d="M388 395h40" fill="none" stroke="#2362d4" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M776 395h40" fill="none" stroke="#2362d4" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1164 395h40" fill="none" stroke="#2362d4" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M994 543V620" fill="none" stroke="#2362d4" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="970" y="590" font-size="20" fill="#49627b" font-weight="400" text-anchor="end">保存・取り出し</text><rect x="811" y="641" width="366" height="178" rx="22" fill="#e1f3ed" stroke="#b3daca" stroke-width="2"/><text x="994" y="681" font-size="29" fill="#087861" font-weight="700" text-anchor="middle">Cloudflare D1</text><text x="994" y="718" font-size="26" fill="#17314d" font-weight="700" text-anchor="middle">サイトの保管庫</text><text x="994" y="754" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">記事・出典はみんなで共用</text><text x="994" y="787" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">「あとで読む」は利用者別</text><path d="M1382 543V620" fill="none" stroke="#2362d4" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1410" y="590" font-size="18" fill="#49627b" font-weight="400" text-anchor="start">本人確認</text><rect x="1219" y="641" width="326" height="178" rx="22" fill="#e8edf8" stroke="#c9d3e9" stroke-width="2"/><text x="1382" y="681" font-size="29" fill="#2362d4" font-weight="700" text-anchor="middle">Googleログイン</text><text x="1382" y="718" font-size="26" fill="#17314d" font-weight="700" text-anchor="middle">あなたの本人確認</text><text x="1382" y="754" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">自分の「あとで読む」を</text><text x="1382" y="787" font-size="22" fill="#17314d" font-weight="400" text-anchor="middle">別の端末でも使える</text><rect x="55" y="641" width="705" height="178" rx="22" fill="white" stroke="#d6e1ef" stroke-width="2"/><text x="82" y="681" font-size="28" fill="#17314d" font-weight="700" text-anchor="start">扱うニュースは6テーマ</text><text x="82" y="726" font-size="25" fill="#2362d4" font-weight="700" text-anchor="start">AI　／　日本経済　／　株式投資</text><text x="82" y="768" font-size="25" fill="#2362d4" font-weight="700" text-anchor="start">国際情勢　／　日本政治　／　芸能ニュース</text><rect x="55" y="853" width="1490" height="68" rx="17" fill="#e6ebf1"/><text x="81" y="894" font-size="25" fill="#49627b" font-weight="400" text-anchor="start">Workers AI：以前の本文要約用。現在は停止中で、今回の毎日更新では使いません。</text><text x="57" y="970" font-size="24" fill="#17314d" font-weight="700" text-anchor="start">サイトを作る・直すときの道具</text><text x="57" y="1008" font-size="22" fill="#49627b" font-weight="400" text-anchor="start">Codex：制作　／　Git・GitHub：変更の記録　／　Node.js・npm：起動と検査</text><text x="57" y="1043" font-size="22" fill="#49627b" font-weight="400" text-anchor="start">Wrangler：Cloudflareへ公開　／　Google Cloud：ログインの設定</text><text x="57" y="1082" font-size="19" fill="#49627b" font-weight="400" text-anchor="start">2026/10/16時点：接続と初回の反映は確認済み。予定時刻の自動実行実績は10/17以降に確認。</text></g></svg>