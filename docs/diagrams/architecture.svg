<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10223b"/><stop offset="1" stop-color="#0c1729"/></linearGradient><linearGradient id="band"><stop stop-color="#1645b8"/><stop offset="1" stop-color="#2f77ef"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#84b9ff" stroke-width="1.5"/></marker></defs><rect width="1440" height="1140" fill="url(#bg)"/><rect x="36" y="28" width="1368" height="126" rx="22" fill="url(#band)"/><g font-family="'Yu Gothic',Meiryo,'Noto Sans JP',sans-serif" fill="#eef4ff"><text x="66" y="60" font-size="14" letter-spacing="3">NEWS POCKET / 2026.10.16</text><text x="66" y="104" font-size="31" font-weight="700">ニュースポケット 全体の構造図</text><text x="66" y="134" font-size="17">既存アプリを拡張。毎日の更新はクラウドで動く設計。自宅PCの常時起動は不要。</text><text x="60" y="188" font-size="16" fill="#b9c9e4">青い線：処理・データの流れ　　緑：接続・動作を確認済み　　黄：設定・実ニュースの検証待ち</text><rect x="36" y="210" width="1368" height="700" rx="22" fill="#112139" stroke="#2b4264"/><rect x="65" y="238" width="350" height="158" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="85" y="270" font-size="23" fill="#eef4ff">GitHub / GitHub Actions</text><text x="85" y="301" font-size="16" fill="#b9c9e4">記事JSONを保存 → 形式を検査</text><text x="85" y="328" font-size="16" fill="#b9c9e4">Node.js 24 → 既存WorkerのAPI</text><text x="85" y="355" font-size="16" fill="#b9c9e4">INGEST_TOKENで記事の受信を認証</text><rect x="83" y="359" width="314" height="25" rx="7" fill="#173f3b"/><text x="94" y="377" font-size="14" fill="#8be0be">既存の記事反映経路は確認済み</text><rect x="535" y="238" width="370" height="158" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="555" y="270" font-size="23" fill="#eef4ff">ChatGPT 専用クラウドタスク</text><text x="555" y="301" font-size="16" fill="#b9c9e4">毎日8:00ごろ：Webで調査・選定</text><text x="555" y="328" font-size="16" fill="#b9c9e4">6テーマの短い独自解説・出典を作る</text><text x="555" y="355" font-size="16" fill="#b9c9e4">既存ChatGPT契約の利用枠を使用</text><rect x="553" y="359" width="334" height="25" rx="7" fill="#173f3b"/><text x="564" y="377" font-size="14" fill="#8be0be">定期設定・初回のサイト反映を確認済み</text><rect x="1025" y="238" width="350" height="158" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="1045" y="270" font-size="23" fill="#eef4ff">Googleログイン</text><text x="1045" y="301" font-size="16" fill="#b9c9e4">OpenID Connect：本人を確認</text><text x="1045" y="328" font-size="16" fill="#b9c9e4">取得権限はopenidのみ</text><text x="1045" y="355" font-size="16" fill="#b9c9e4">メールやパスワードをDBへ保存しない</text><rect x="1043" y="359" width="314" height="25" rx="7" fill="#173f3b"/><text x="1054" y="377" font-size="14" fill="#8be0be">既存ログインを維持</text><rect x="65" y="520" width="350" height="175" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="85" y="552" font-size="23" fill="#eef4ff">閲覧画面（ブラウザ）</text><text x="85" y="583" font-size="16" fill="#b9c9e4">HTML / CSS / JavaScript</text><text x="85" y="610" font-size="16" fill="#b9c9e4">見出し一覧 → クリックで詳細へ</text><text x="85" y="637" font-size="16" fill="#b9c9e4">6タブ・あとで読む・設定・問い合わせ</text><rect x="83" y="658" width="314" height="25" rx="7" fill="#173f3b"/><text x="94" y="676" font-size="14" fill="#8be0be">既存URL・一覧と詳細を確認済み</text><rect x="535" y="495" width="370" height="218" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="555" y="527" font-size="23" fill="#eef4ff">Cloudflare Workers</text><text x="555" y="558" font-size="16" fill="#b9c9e4">既存サイトのAPI・記事受信と表示</text><text x="555" y="585" font-size="16" fill="#b9c9e4">Secrets：Google秘密情報・認証キー</text><text x="555" y="612" font-size="16" fill="#b9c9e4">INGEST_TOKENを公開コードから分離</text><text x="555" y="639" font-size="16" fill="#b9c9e4">ログイン・利用者別保存・無料枠制御</text><rect x="553" y="676" width="334" height="25" rx="7" fill="#173f3b"/><text x="564" y="694" font-size="14" fill="#8be0be">既存 news-pocket を更新</text><rect x="1025" y="520" width="350" height="175" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="1045" y="552" font-size="23" fill="#eef4ff">Cloudflare D1</text><text x="1045" y="583" font-size="16" fill="#b9c9e4">SQLite互換のデータベース</text><text x="1045" y="610" font-size="16" fill="#b9c9e4">記事・出典・更新実績を保存</text><text x="1045" y="637" font-size="16" fill="#b9c9e4">利用者・保存・利用枠・非公開問い合わせ</text><rect x="1043" y="658" width="314" height="25" rx="7" fill="#173f3b"/><text x="1054" y="676" font-size="14" fill="#8be0be">既存DB・保存済みデータを維持</text><rect x="535" y="760" width="370" height="145" rx="17" fill="#182b46" stroke="#3d587d" stroke-width="1.5"/><text x="555" y="792" font-size="23" fill="#eef4ff">Cloudflare Workers AI</text><text x="555" y="823" font-size="16" fill="#b9c9e4">Qwen3：従来の本文要約用に接続</text><text x="555" y="850" font-size="16" fill="#b9c9e4">利用条件の確認待ちで本文要約は停止</text><rect x="553" y="868" width="334" height="25" rx="7" fill="#483b24"/><text x="564" y="886" font-size="14" fill="#ffd48a">今回の毎日更新では使用しない</text><path d="M240 396V445H610V488" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="260" y="434" font-size="15" fill="#84b9ff">できた記事を配信</text><path d="M535 315H422" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="430" y="215" font-size="15" fill="#84b9ff">記事JSONの書込み</text><path d="M1200 396V455H825V488" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1028" y="444" font-size="15" fill="#84b9ff">Googleで本人確認</text><path d="M415 574H528" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="427" y="556" font-size="15" fill="#84b9ff">HTTPS /api</text><path d="M535 628H422" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M905 575H1018" fill="none" stroke="#84b9ff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="926" y="556" font-size="15" fill="#84b9ff">保存・参照</text><text x="65" y="747" font-size="18" fill="#eef4ff">閲覧はスマホ・PCから</text><text x="65" y="777" font-size="16" fill="#b9c9e4">記事を読むだけでAIを再実行しない</text><text x="65" y="807" font-size="16" fill="#b9c9e4">出典リンクは詳細画面に表示</text><text x="1030" y="747" font-size="16" fill="#b9c9e4">通常の未保存記事は90日で整理</text><text x="1030" y="777" font-size="16" fill="#b9c9e4">件数・容量でも整理</text><text x="1030" y="807" font-size="16" fill="#b9c9e4">整理処理は毎日8:35ごろに設定</text><rect x="36" y="938" width="1368" height="162" rx="20" fill="#172b43" stroke="#3d587d"/><text x="62" y="974" font-size="22" fill="#eef4ff">開発・更新に使うツール（毎日の運転中はPC不要）</text><text x="62" y="1010" font-size="19" fill="#b9c9e4">Codex：実装・検証　／　Git・GitHub：コード管理　／　Node.js 24・npm：起動と検査</text><text x="62" y="1045" font-size="19" fill="#b9c9e4">Wrangler：Cloudflareへの公開・D1移行・Secrets登録　／　Google Cloud：ログインの設定</text><text x="62" y="1078" font-size="16" fill="#ffd48a">確認済み・設定待ちは図の作成時点の状態。日次scheduleの実績は、初回自動実行後に別途確認する。</text></g></svg>