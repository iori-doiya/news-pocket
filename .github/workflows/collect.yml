name: Collect news
on:
  # With no enabled sources, this schedule only cleans expired private records.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: news-pocket-collect
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run collect
        env:
          COLLECTION_ENABLED: ${{ vars.COLLECTION_ENABLED }}
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
