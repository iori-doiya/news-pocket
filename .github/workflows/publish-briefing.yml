name: Publish news briefing
on:
  push:
    branches: [main]
    paths: ['data/briefings/*.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: news-pocket-publish-briefing
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node scripts/publish-briefing.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
